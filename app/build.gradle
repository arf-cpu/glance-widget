plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.vro.glance'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.vro.glance'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
